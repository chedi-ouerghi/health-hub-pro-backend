services:
  - type: web
    name: health-hub-pro-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        value: https://health-hub-pro.pages.dev
      - key: CORS_ORIGINS
        value: https://health-hub-pro.pages.dev,http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: RATE_LIMIT_WHITELIST
        value: 127.0.0.1,::1
      - key: SENTRY_DSN
        sync: false
      - key: TWO_FACTOR_ENCRYPTION_KEY
        sync: false
      - key: TWO_FACTOR_REQUIRED
        value: false
      - key: UPLOAD_DIR
        value: uploads